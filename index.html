<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledo Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-view" class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 420px; margin: 0 auto;">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="admin-email" placeholder="Email Address" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <input type="password" id="admin-password" placeholder="Password" autocomplete="off" required>
                </div>
                <button type="submit" id="btn-login" class="btn">Login to Dashboard</button>
            </form>
            <div id="login-error"></div>
        </div>
    </div>

    <div id="dashboard-view" class="container" style="display: none;">
        <header>
            <h2>Ledo Telemetry</h2>
            <button id="btn-logout" class="btn btn-outline">Logout</button>
        </header>

        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 20px; font-weight: 500;">User Support Tickets</h3>
            <div class="table-responsive">
                <table id="crash-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User Email</th>
                            <th>Subject</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="crash-tbody">
                        <tr><td colspan="6" style="text-align: center; padding: 30px;">Loading tickets...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Message Modal -->
    <div id="message-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content card" style="max-width: 500px; width: 100%;">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Send Message to User</h3>
            <div style="margin-bottom: 15px; color: #a1a1aa; font-size: 14px;">
                Replying to ticket: <strong id="modal-ticket-subject" style="color: #fff;"></strong>
            </div>
            <textarea id="modal-message-text" placeholder="Write your reply here..." class="modern-input" style="width: 100%; height: 120px; padding: 12px; border-radius: 8px; margin-bottom: 15px; resize: vertical;"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button id="btn-modal-cancel" class="btn btn-outline" style="padding: 8px 16px;">Cancel</button>
                <button id="btn-modal-send" class="btn" style="padding: 8px 16px;">Send Message</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
